name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run regression tests
        run: npm test

  deploy:
    name: Deploy validated release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set app version
        run: |
          set -euo pipefail
          VERSION="Build $(TZ=America/Sao_Paulo date +'%d/%m/%Y %H:%M') · ${GITHUB_SHA::7}"
          grep -q "__APP_VERSION__" crmcabana/index.html
          sed -i "s|__APP_VERSION__|$VERSION|" crmcabana/index.html
          ! grep -q "__APP_VERSION__" crmcabana/index.html
          echo "Versao publicada: $VERSION"

      - name: Verify release artifact
        run: |
          set -euo pipefail
          test -s index.html
          test -s crmcabana/index.html
          test -s crmcabana/app.js
          test -s crmcabana/styles.css

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
